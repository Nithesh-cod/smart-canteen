services:
  - type: web
    name: smart-canteen-api
    env: node
    plan: free
    # Skip devDependencies (jest, firebase-tools) in production.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PRINTER_TYPE
        value: none            # the thermal printer runs via the LOCAL print-agent, not here
      # ── Set these manually in the Render dashboard (Environment tab) ──────────
      # FIREBASE_SERVICE_ACCOUNT → paste the ENTIRE service-account JSON as ONE
      #                            value (config/firebase reads it via this env var).
      # FIREBASE_PROJECT_ID      → smart-canteen-64c7e
      # JWT_SECRET               → strong random secret (see docs/DEPLOYMENT.md)
      # JWT_REFRESH_SECRET       → strong random secret
      # RAZORPAY_KEY_ID          → rzp_live_... (or rzp_test_...)
      # RAZORPAY_KEY_SECRET      → Razorpay secret
      # RAZORPAY_WEBHOOK_SECRET  → must match the secret set on the Razorpay webhook
      # FRONTEND_URLS            → https://<your-app>.vercel.app  (comma-separated, for CORS)
      # CANTEEN_NAME / CANTEEN_COLLEGE / CANTEEN_ADDRESS / CANTEEN_GSTIN / CANTEEN_PHONE
      #
      # NOTE: DATABASE_URL / SUPABASE_URL / SUPABASE_ANON_KEY are no longer used
      #       (migrated to Firestore). ADMIN_ROLLS / CHEF_ROLLS are gone too —
      #       roles now live in the students.role field in Firestore.
