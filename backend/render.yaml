services:
  # ── Shared state: cart stock holds + Socket.IO fanout ──────────────────────
  # Required even on a single instance, for two separate reasons:
  #
  #   1. app.js refuses to boot in production without REDIS_URL. That guard is
  #      about what happens NEXT: the day someone raises numInstances, a second
  #      process would start with its own private stock count and the same last
  #      samosa would sell twice, silently. Requiring Redis from day one means
  #      scaling is a number change rather than a correctness cliff.
  #
  #   2. It is the authority for live cart availability. Firestore sustains
  #      roughly one write per second per document, and holding stock on
  #      add-to-cart writes the item's document on every cart tap — a lunch
  #      rush goes straight past that limit.
  #
  # Must share a region with the web service: Render's private network does
  # not cross regions.
  - type: keyvalue
    name: smart-canteen-redis
    plan: starter
    region: singapore
    ipAllowList: []          # private network only — never expose it publicly

  - type: web
    name: smart-canteen-api
    env: node
    # Singapore is Render's closest region to India. Oregon adds roughly 250ms
    # round-trip to every request, and since add-to-cart now reserves stock on
    # the server, students feel that on every single tap.
    region: singapore
    # 'starter' with one instance suits a single canteen. Deliberately NOT
    # 'free': that spins the instance down when idle, which drops websockets
    # and strands in-flight stock holds until the sweeper reclaims them.
    #
    # To scale out later, raise numInstances — the Redis adapter and shared
    # stock authority are already wired, so nothing else has to change.
    plan: starter
    numInstances: 1
    # Skip devDependencies (jest, firebase-tools) in production.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smart-canteen-redis
          property: connectionString
      # How long an item stays held after it is added to a cart.
      - key: CART_HOLD_TTL_SECONDS
        value: 600
      - key: PRINTER_TYPE
        value: none            # the thermal printer runs via the LOCAL print-agent, not here
      # ── Set these manually in the Render dashboard (Environment tab) ──────────
      # FIREBASE_SERVICE_ACCOUNT → paste the ENTIRE service-account JSON as ONE
      #                            value (config/firebase reads it via this env var).
      # FIREBASE_PROJECT_ID      → smart-canteen-64c7e
      # JWT_SECRET               → strong random secret (see docs/DEPLOYMENT.md)
      # JWT_REFRESH_SECRET       → strong random secret
      # RAZORPAY_KEY_ID          → rzp_live_... (or rzp_test_...)
      # RAZORPAY_KEY_SECRET      → Razorpay secret
      # RAZORPAY_WEBHOOK_SECRET  → must match the secret set on the Razorpay webhook
      # FRONTEND_URLS            → https://<your-app>.vercel.app  (comma-separated, for CORS)
      # CANTEEN_NAME / CANTEEN_COLLEGE / CANTEEN_ADDRESS / CANTEEN_GSTIN / CANTEEN_PHONE
      #
      # NOTE: DATABASE_URL / SUPABASE_URL / SUPABASE_ANON_KEY are no longer used
      #       (migrated to Firestore). ADMIN_ROLLS / CHEF_ROLLS are gone too —
      #       roles now live in the students.role field in Firestore.
